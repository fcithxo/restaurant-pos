
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant POS System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #333;
        }

        header {
            background: #263238;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        h2 {
            margin-top: 0;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
        }

        .item, .cart {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 6px #00000012;
        }

        .item {
            text-align: center;
        }

        .item h3 {
            margin-top: 5px;
        }

        .price {
            color: #388e3c;
            font-weight: bold;
            margin: 10px 0;
        }

        button {
            border: none;
            border-radius: 5px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn {
            background: #388e3c;
            color: white;
            width: 100%;
        }

        .add-btn:hover {
            background: #2e7d32;
        }

        .cart {
            align-self: start;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
        }

        .cart-row button {
            padding: 5px 9px;
            background: #eeeeee;
        }

        .remove-btn {
            color: #c62828;
        }

        .total {
            font-size: 21px;
            font-weight: bold;
            margin: 20px 0;
        }

        .checkout-btn {
            background: #1565c0;
            color: white;
            width: 100%;
            padding: 14px;
        }

        .clear-btn {
            background: #e0e0e0;
            width: 100%;
            margin-top: 8px;
        }

        #receipt {
            white-space: pre-wrap;
            margin-top: 15px;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Restaurant POS System</h1>
    <p>Point of Sale | Order Management</p>
</header>

<main class="container">

    <section>
        <h2>Food Menu</h2>

        <div class="menu" id="menu"></div>
    </section>

    <section class="cart">
        <h2>Current Order</h2>

        <div id="cart-items">
            <p>Your cart is empty.</p>
        </div>

        <p class="total">
            Total: ₱<span id="total">0.00</span>
        </p>

        <button class="checkout-btn" onclick="checkout()">
            Checkout
        </button>

        <button class="clear-btn" onclick="clearCart()">
            Clear Order
        </button>

        <div id="receipt"></div>
    </section>

</main>

<script>
    const products = [
        { id: 1, name: "Beef Burger", price: 120 },
        { id: 2, name: "Chicken Meal", price: 150 },
        { id: 3, name: "Spaghetti", price: 100 },
        { id: 4, name: "French Fries", price: 60 },
        { id: 5, name: "Fried Rice", price: 45 },
        { id: 6, name: "Iced Tea", price: 35 },
        { id: 7, name: "Coffee", price: 50 },
        { id: 8, name: "Chocolate Cake", price: 85 }
    ];

    let cart = [];

    function displayMenu() {
        const menu = document.getElementById("menu");

        menu.innerHTML = products.map(product => `
            <div class="item">
                <h3>${product.name}</h3>
                <p class="price">₱${product.price.toFixed(2)}</p>
                <button class="add-btn"
                    onclick="addToCart(${product.id})">
                    Add to Order
                </button>
            </div>
        `).join("");
    }

    function addToCart(id) {
        const product = products.find(item => item.id === id);
        const existing = cart.find(item => item.id === id);

        if (existing) {
            existing.quantity++;
        } else {
            cart.push({
                ...product,
                quantity: 1
            });
        }

        renderCart();
    }

    function changeQuantity(id, amount) {
        const item = cart.find(item => item.id === id);

        if (!item) return;

        item.quantity += amount;

        if (item.quantity <= 0) {
            cart = cart.filter(item => item.id !== id);
        }

        renderCart();
    }

    function removeItem(id) {
        cart = cart.filter(item => item.id !== id);
        renderCart();
    }

    function renderCart() {
        const cartItems = document.getElementById("cart-items");
        const totalElement = document.getElementById("total");

        if (cart.length === 0) {
            cartItems.innerHTML = "<p>Your cart is empty.</p>";
            totalElement.textContent = "0.00";
            return;
        }

        cartItems.innerHTML = cart.map(item => `
            <div class="cart-row">
                <div>
                    <strong>${item.name}</strong><br>
                    ₱${item.price.toFixed(2)} each<br>
                    Qty: ${item.quantity}
                </div>

                <div>
                    <button onclick="changeQuantity(${item.id}, -1)">
                        −
                    </button>
                    <button onclick="changeQuantity(${item.id}, 1)">
                        +
                    </button>
                    <button class="remove-btn"
                        onclick="removeItem(${item.id})">
                        ✕
                    </button>
                </div>
            </div>
        `).join("");

        totalElement.textContent = getTotal().toFixed(2);
    }

    function getTotal() {
        return cart.reduce(
            (sum, item) => sum + item.price * item.quantity,
            0
        );
    }

    function checkout() {
        if (cart.length === 0) {
            alert("Please add items to your order first.");
            return;
        }

        const total = getTotal();

        const receipt = cart.map(item =>
            `${item.name} x${item.quantity} = ₱${(
                item.price * item.quantity
            ).toFixed(2)}`
        ).join("\n");

        const confirmed = confirm(
            "Confirm order?\n\n" +
            receipt +
            "\n\nTOTAL: ₱" + total.toFixed(2)
        );

        if (!confirmed) return;

        document.getElementById("receipt").textContent =
            "ORDER COMPLETED\n" +
            "--------------------\n" +
            receipt +
            "\n--------------------\n" +
            "TOTAL: ₱" + total.toFixed(2) +
            "\nThank you for your order!";

        alert("Order completed successfully!");

        cart = [];
        renderCart();
    }

    function clearCart() {
        if (cart.length === 0) return;

        if (confirm("Are you sure you want to clear this order?")) {
            cart = [];
            renderCart();
            document.getElementById("receipt").textContent = "";
        }
    }

    displayMenu();
</script>

</body>
</html>
